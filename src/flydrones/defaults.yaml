# FlyDrones default configuration.
# Every value can be overridden by a YAML file passed with --config.
# Group "types" are regular expressions matched against the connectome cell type.
# The same names work for MiniFly (synthetic) and MaleCNS v1.0 (real data).

brain:
  source: minifly          # "minifly" or path to a .npz built by `flydrones build-brain`
  seed: 0
  lif:                     # Shiu et al. 2024 parameters; dt raised to 0.5 ms for real time
    v_rest: -52.0
    v_reset: -52.0
    v_th: -45.0
    tau_m: 20.0
    tau_syn: 5.0
    t_ref: 2.2
    delay: 1.8
    w_syn: 0.275
    poisson_factor: 250.0
    dt: 0.5
    noise_mv: 0.0            # membrane noise; keep 0 for MaleCNS (Shiu et al. use none)
  # Tonic depolarisation (mV). This is the "I am flying" internal state: without
  # it the flight descending neurons are silent. Engineered, not from the connectome.
  bias:
    DNg02_L: 9.0
    DNg02_R: 9.0
    # The compass ring needs a tonic drive to hold a bump at all, the way an
    # attractor needs energy. Without it EPG is silent and there is no heading.
    # 9 mV against a 7 mV threshold: every column would fire, and Delta7
    # inhibition is what leaves only one. The shift cells sit just under
    # threshold so that they only speak when the halteres do.
    EPG: 9.0
    PEN_L: 5.5
    PEN_R: 5.5
  record_neurons: 400      # neurons shown in the live spike raster

# ---------------------------------------------------------------------------
# Sensory inputs: which neurons receive camera / IMU signals
# feature: brightness | ftb | btf | up | down | loom | loom_speed | yaw_pos | yaw_neg
#   ftb/btf = front-to-back / back-to-front image motion for that eye
#   up/down = scene moving up / down
# ---------------------------------------------------------------------------
inputs:
  R16_L:   {types: ["^R1-R6$"], side: L, feature: brightness, eye: L, max_hz: 40}
  R16_R:   {types: ["^R1-R6$"], side: R, feature: brightness, eye: R, max_hz: 40}
  T4a_L:   {types: ["^T4a$", "^T5a$"], side: L, feature: ftb,  eye: L, max_hz: 120}
  T4a_R:   {types: ["^T4a$", "^T5a$"], side: R, feature: ftb,  eye: R, max_hz: 120}
  T4b_L:   {types: ["^T4b$", "^T5b$"], side: L, feature: btf,  eye: L, max_hz: 120}
  T4b_R:   {types: ["^T4b$", "^T5b$"], side: R, feature: btf,  eye: R, max_hz: 120}
  T4c_L:   {types: ["^T4c$", "^T5c$"], side: L, feature: up,   eye: L, max_hz: 120}
  T4c_R:   {types: ["^T4c$", "^T5c$"], side: R, feature: up,   eye: R, max_hz: 120}
  T4d_L:   {types: ["^T4d$", "^T5d$"], side: L, feature: down, eye: L, max_hz: 120}
  T4d_R:   {types: ["^T4d$", "^T5d$"], side: R, feature: down, eye: R, max_hz: 120}
  LPLC2_L: {types: ["^LPLC2$"], side: L, feature: loom, eye: L, max_hz: 200}
  LPLC2_R: {types: ["^LPLC2$"], side: R, feature: loom, eye: R, max_hz: 200}
  LC4_L:   {types: ["^LC4$"], side: L, feature: loom_speed, eye: L, max_hz: 150}
  LC4_R:   {types: ["^LC4$"], side: R, feature: loom_speed, eye: R, max_hz: 150}
  HAL_L:   {types: ["(?i)haltere"], side: L, feature: yaw_neg, max_hz: 50}
  HAL_R:   {types: ["(?i)haltere"], side: R, feature: yaw_pos, max_hz: 50}
  # --- cognition (see docs/COGNITION.md). These carry vectors, not grids:
  # a sparse code of what the eye is looking at, a punishment signal, and the
  # goal direction held around the central-complex ring.
  VPN_L:   {types: ["^VPN-MB$"], side: L, feature: scene_L, max_hz: 70}
  VPN_R:   {types: ["^VPN-MB$"], side: R, feature: scene_R, max_hz: 70}
  PPL1_L:  {types: ["^PPL1"], side: L, feature: punish, max_hz: 140}
  PPL1_R:  {types: ["^PPL1"], side: R, feature: punish, max_hz: 140}
  GOAL:    {types: ["^FC2$"], feature: goal, max_hz: 90}
  EPG_SET: {types: ["^EPG$"], feature: compass_set, max_hz: 120}

imu:
  yaw_saturation_dps: 150  # yaw rate that drives haltere inputs at max_hz

# ---------------------------------------------------------------------------
# Motor outputs: descending neurons read out as flight commands
# ---------------------------------------------------------------------------
outputs:
  DNg02_L: {types: ["^DNg02"], side: L, note: "wing-stroke amplitude (Namiki et al. 2022)"}
  DNg02_R: {types: ["^DNg02"], side: R, note: "wing-stroke amplitude (Namiki et al. 2022)"}
  DNp03_L: {types: ["^DNp03$"], side: L, note: "looming-evoked flight saccades (Curr Biol 2025)"}
  DNp03_R: {types: ["^DNp03$"], side: R, note: "looming-evoked flight saccades (Curr Biol 2025)"}
  DNp01_L: {types: ["^DNp01$", "^GF$"], side: L, note: "giant fiber, escape takeoff (Ache et al. 2019)"}
  DNp01_R: {types: ["^DNp01$", "^GF$"], side: R, note: "giant fiber, escape takeoff (Ache et al. 2019)"}
  MBON_L:  {types: ["^MBON-g1"], side: L, note: "MBON-g1pedc: high = this scene is safe (Hige et al. 2015)"}
  MBON_R:  {types: ["^MBON-g1"], side: R, note: "the same, right hemisphere"}

# Groups that are only watched: they feed the telemetry, the compass and the
# music, and nothing in the control path reads them.
monitors:
  KC_L:    {types: ["^KCg-d$"], side: L, note: "visual Kenyon cells: the sparse code of the scene"}
  KC_R:    {types: ["^KCg-d$"], side: R}
  APL_L:   {types: ["^APL$"], side: L, note: "feedback inhibition that keeps the KC code sparse"}
  APL_R:   {types: ["^APL$"], side: R}
  EPG:     {types: ["^EPG$"], note: "the heading bump"}
  FC2m:    {types: ["^FC2$"], note: "the goal column"}
  PEN_L:   {types: ["^PEN$"], side: L, note: "the shift cells that carry the bump around"}
  PEN_R:   {types: ["^PEN$"], side: R}
  PFL3_L:  {types: ["^PFL3$"], side: L, note: "steering: heading compared against goal"}
  PFL3_R:  {types: ["^PFL3$"], side: R}
  TURN_L:  {types: ["^LAL-turn$"], side: L, note: "the learned avoidance turn, held off by the MBON"}
  TURN_R:  {types: ["^LAL-turn$"], side: R}

vision:
  width: 96                # camera frame is resized to this before encoding
  height: 72
  grid: [6, 8]             # rows, cols of the ommatidia grid per eye
  flow_gain: 1.2           # pixels/frame that saturate a motion channel
  loom_gain: 8.0           # (expansion - loom_floor) * gain -> 0..1
  loom_floor: 0.04
  blur: 1

# ---------------------------------------------------------------------------
# Decoder: descending-neuron rates (Hz, minus resting baseline) -> command axes
# Each axis = gain * sum(weight * (rate - baseline)). Command range is -1..1.
# ---------------------------------------------------------------------------
decoder:
  window_ms: 50
  smoothing: 0.2           # EMA factor per control tick (0 = frozen, 1 = raw)
  settle_s: 1.5            # measure resting baselines for this long at start
  deadzone: 0.04
  readout_file: null       # JSON from `flydrones calibrate` overrides the terms below
  axes:
    throttle:              # vertical speed
      gain: 0.022
      terms: {DNg02_L: 0.5, DNg02_R: 0.5}
    yaw:                   # yaw rate, + = clockwise / right
      gain: 0.05
      terms: {DNg02_R: 1.0, DNg02_L: -1.0, DNp03_L: 0.8, DNp03_R: -0.8}
    forward:
      gain: 0.0
      terms: {}
    lateral:
      gain: 0.0
      terms: {}
  cruise: 0.0              # constant forward speed you choose; looming DNs brake it
  brake_terms: {DNp03_L: 0.02, DNp03_R: 0.02, DNp01_L: 0.03, DNp01_R: 0.03}
  escape:
    terms: [DNp01_L, DNp01_R]
    threshold_hz: 20
    mode: climb            # climb | drop | brake
    duration_s: 0.7
    strength: 0.8

# ---------------------------------------------------------------------------
# Safety governor. It always has the last word over the brain.
# ---------------------------------------------------------------------------
safety:
  max_throttle: 0.6
  max_yaw: 0.6
  max_forward: 0.4
  max_lateral: 0.4
  slew_per_s: 2.5          # max command change per second
  min_alt_m: 0.3
  max_alt_m: 2.2
  geofence_radius_m: 3.0   # only enforced when the drone reports position
  brain_timeout_s: 0.5     # hover if the brain stops producing output
  min_battery_pct: 20      # land below this
  max_flight_s: 180
  # The LTE link, when the drone is flying on one (docs/LTE.md). Only consulted
  # when a probe is attached: `flydrones fly --link orange-airbox`. Scores come
  # from flydrones.link.probe.THRESHOLDS.
  link:
    enabled: true
    hold_below: 0.35       # below this the drone stops going anywhere and hovers
    land_below: 0.15       # below this it lands, before the link decides for it
    timeout_s: 5.0         # no fresh reading for this long counts as no link
    grace_s: 2.0           # how long it has to stay bad; one bad poll is not a lost link

# ---------------------------------------------------------------------------
# Cognition: the mushroom-body memory and the central-complex compass.
# docs/COGNITION.md explains what is biology and what is engineering here.
# ---------------------------------------------------------------------------
cognition:
  enabled: true
  columns: 16              # central-complex columns: 22.5 degrees each
  scene_keep: 0.45         # fraction of eye cells kept in the code the KCs see
  scene_gain: 1.6          # contrast -> drive
  compass_seed_s: 0.6      # how long the bump is planted for at the start of a flight
  compass_seed_column: 0   # "straight ahead at take-off" is this column
  goal_width: 1.2          # columns; how sharp the goal is
  punish_decay_s: 0.35     # dopamine is a pulse, not a mood
  collision_punishment: 1.0
  punish_on_escape: 0.8   # a near miss teaches as well, at a lower dose
  mushroom_body:
    enabled: true
    learning_rate: 0.55    # depression per second of full dopamine and full KC rate
    forget_s: 300          # a depressed synapse creeps back to where it started
    floor: 0.08            # and never goes below this fraction of it
    dan_ref_hz: 60         # dopamine rate that counts as a full punishment
    kc_ref_hz: 25          # Kenyon-cell rate that counts as fully active

control:
  hz: 20
  takeoff: true

# ---------------------------------------------------------------------------
# Compositor: neuron groups -> music (Pure Data, Max/MSP, TidalCycles, Strudel)
# See docs/MUSIC.md. Thresholds are firing rates in Hz *above the resting rate*
# the decoder measures during warm-up, so the same score works on MiniFly and
# on MaleCNS, whose neurons idle at completely different rates.
#   mode: repeat  = a note every every_s..fastest_s while the group is excited
#         trigger = one note per burst, however long the burst lasts
# ---------------------------------------------------------------------------
music:
  scale: minor_pentatonic  # see flydrones.music.events.SCALES
  root: C3
  cps: 0.5                 # cycles per second for Tidal/Strudel (0.5 = 120 bpm in 4/4)
  tempo_from: fixed        # fixed | drive (DNg02 lift) | alt
  tempo_swing: 0.4         # how far tempo_from may pull the tempo, either way
  smoothing: 0.35          # EMA on firing rates before they become music
  relative_to_baseline: true
  latency_s: 0.2           # scheduling headroom: OSC timetags for SuperDirt,
                           # a delay_ms argument for Pure Data and Max
  drive_span_hz: 25        # DNg02 excursion above rest that counts as "full lift"
  loom_max_hz: 110         # LPLC2/LC4 rate that saturates the loom control
  # Voice sound names are generic; each target maps them to something it has.
  sounds:
    superdirt: {flybass: supersaw, flylead: superpwm, flyperc: superhat,
                flycrash: superhoover, flyloom: supersquare, flyair: supersine,
                flyspark: superhat, flysting: superzow, flyturn: superpwm}
    strudel:   {flybass: sawtooth, flylead: triangle, flyperc: square,
                flycrash: sawtooth, flyloom: square, flyair: sine,
                flyspark: triangle, flysting: sawtooth, flyturn: square}
  voices:
    lift:
      groups: {DNg02_L: 0.5, DNg02_R: 0.5}
      note: "wing-stroke amplitude, both sides: the bass pulse of the flight"
      sound: flybass
      mode: repeat
      on_hz: 4
      off_hz: 2
      span_hz: 22
      low: 36            # C2
      high: 55
      every_s: 0.5
      fastest_s: 0.15
      duration: 0.35
      pan: 0.5
      orbit: 0
      channel: 1
    wing_left:
      group: DNg02_L
      note: "left wing: melody, panned left; leads the right one in a turn"
      sound: flylead
      mode: repeat
      on_hz: 6
      off_hz: 3
      span_hz: 24
      low: 60
      high: 84
      every_s: 0.34
      fastest_s: 0.11
      duration: 0.2
      pan: 0.18
      orbit: 1
      channel: 2
    wing_right:
      group: DNg02_R
      note: "right wing: the same melody a beat apart; a yaw is the two drifting"
      sound: flylead
      mode: repeat
      on_hz: 6
      off_hz: 3
      span_hz: 24
      low: 60
      high: 84
      every_s: 0.29
      fastest_s: 0.09
      duration: 0.2
      pan: 0.82
      orbit: 1
      channel: 3
    saccade_left:
      group: DNp03_L
      note: "DNp03: looming-evoked flight saccade, one hit per burst"
      sound: flyperc
      mode: trigger
      on_hz: 8
      off_hz: 3
      span_hz: 50
      low: 67
      high: 91
      min_gap_s: 0.12
      duration: 0.12
      pan: 0.3
      orbit: 2
      channel: 10
    saccade_right:
      group: DNp03_R
      note: "the mirror-image saccade"
      sound: flyperc
      mode: trigger
      on_hz: 8
      off_hz: 3
      span_hz: 50
      low: 67
      high: 91
      min_gap_s: 0.12
      duration: 0.12
      pan: 0.7
      orbit: 2
      channel: 10
    giant_fiber:
      groups: {DNp01_L: 0.5, DNp01_R: 0.5}
      note: "DNp01: the escape. One enormous note, and nothing for half a second"
      sound: flycrash
      mode: trigger
      on_hz: 12
      off_hz: 4
      span_hz: 40
      low: 24
      high: 48
      min_gap_s: 0.5
      duration: 1.2
      gain: 1.0
      pan: 0.5
      orbit: 3
      channel: 10
    loom:
      groups: {LPLC2_L: 0.35, LPLC2_R: 0.35, LC4_L: 0.15, LC4_R: 0.15}
      note: "something is approaching: a riser that only exists while it does"
      sound: flyloom
      mode: repeat
      on_hz: 10
      off_hz: 4
      span_hz: 90
      low: 72
      high: 96
      every_s: 0.18
      fastest_s: 0.06
      duration: 0.1
      gain: 0.85
      pan: 0.5
      orbit: 4
      channel: 4
    rising:
      groups: {T4c_L: 0.5, T4c_R: 0.5}
      note: "upward optic flow (the world sinking): sparse high texture"
      sound: flyair
      mode: repeat
      on_hz: 12
      off_hz: 6
      span_hz: 45
      low: 72
      high: 96
      every_s: 0.6
      fastest_s: 0.25
      duration: 0.5
      gain: 0.6
      pan: 0.35
      orbit: 5
      channel: 5
    # --- the cognitive voices. The fly is not only reacting now.
    kenyon:
      groups: {KC_L: 0.5, KC_R: 0.5}
      note: "the sparse code of whatever the fly is looking at: a few cells in a few hundred"
      sound: flyspark
      mode: repeat
      absolute: true         # the Kenyon cells idle at nothing; the raw rate is the signal
      on_hz: 1.0
      off_hz: 0.4
      span_hz: 5
      low: 84
      high: 103
      every_s: 0.35
      fastest_s: 0.12
      duration: 0.08
      gain: 0.5
      pan: 0.5
      orbit: 6
      channel: 7
    memory:
      groups: {MBON_L: 0.5, MBON_R: 0.5}
      note: "MBON-g1pedc letting go: this voice is the sound of having learned something"
      sound: flyturn
      mode: repeat
      rectify: neg           # it speaks when the MBON falls *below* its resting rate
      on_hz: 6
      off_hz: 3
      span_hz: 30
      low: 43
      high: 67
      every_s: 0.9
      fastest_s: 0.4
      duration: 0.8
      gain: 0.7
      pan: 0.45
      orbit: 7
      channel: 8
    dopamine:
      groups: {PPL1_L: 0.5, PPL1_R: 0.5}
      note: "PPL1: the moment something hurt. One note per lesson"
      sound: flysting
      mode: trigger
      on_hz: 20
      off_hz: 8
      span_hz: 100
      low: 31
      high: 55
      min_gap_s: 0.4
      duration: 0.9
      gain: 1.0
      pan: 0.5
      orbit: 3
      channel: 10
    avoid:
      groups: {TURN_L: 0.5, TURN_R: 0.5}
      note: "the learned turn, once the MBON lets go of it"
      sound: flyturn
      mode: repeat
      absolute: true
      on_hz: 2.5
      off_hz: 1.0
      span_hz: 10
      low: 55
      high: 79
      every_s: 0.3
      fastest_s: 0.12
      duration: 0.25
      gain: 0.85
      pan: 0.55
      orbit: 7
      channel: 9
    falling:
      groups: {T4d_L: 0.5, T4d_R: 0.5}
      note: "downward optic flow (the world rising): the same texture, lower"
      sound: flyair
      mode: repeat
      on_hz: 12
      off_hz: 6
      span_hz: 55
      low: 48
      high: 72
      every_s: 0.6
      fastest_s: 0.25
      duration: 0.5
      gain: 0.6
      pan: 0.65
      orbit: 5
      channel: 6
