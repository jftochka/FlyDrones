# "Melodic, elastic and bright" — the config the audio track was rendered with.
#
#   flydrones compose --config configs/bright.yaml --seconds 150 --render track.wav
#
# Nothing here changes the flight. It changes what the same neurons sound like:
# the key they are quantised to, how often each voice is allowed to speak, and
# the patch each one is played through. The flight is still the composer.
music:
  # Lydian is the bright mode — the raised fourth is the whole reason it sounds
  # like daylight — and D3 puts the wings in the middle of a singing register.
  scale: lydian
  root: D3
  cps: 0.45
  tempo_from: drive        # the tempo follows the wing-stroke neurons: this is the elastic part
  tempo_swing: 0.5         # and it is allowed to move half again either way
  smoothing: 0.12          # a low-pass on the firing rates: the melodic part. At 0.3 the
                           # voices track the flight tightly and leap about — 65% stepwise
                           # motion; at 0.12 it measures 70% and still turns when the drone
                           # turns. Below about 0.08 the tune stops following the flight.
  latency_s: 0.2

  voices:
    # --- the melody: two wings, an octave and a half each, panned apart and
    # given room to be heard. Fewer notes than the default, longer ones.
    wing_left:
      low: 62
      high: 81
      every_s: 0.42
      fastest_s: 0.16
      duration: 0.42
      on_hz: 7
      pan: 0.22
    wing_right:
      low: 62
      high: 81
      every_s: 0.46
      fastest_s: 0.19
      duration: 0.38
      on_hz: 7
      pan: 0.78
    # --- the bass pulse, kept simple and central
    lift:
      low: 45
      high: 64
      every_s: 0.62
      fastest_s: 0.22
      duration: 0.55
      on_hz: 5
    # --- texture, thinned right out so the melody has air around it
    rising:
      low: 74
      high: 93
      every_s: 1.1
      fastest_s: 0.5
      duration: 1.4
      gain: 0.45
      on_hz: 16
    falling:
      low: 50
      high: 69
      every_s: 1.1
      fastest_s: 0.5
      duration: 1.4
      gain: 0.45
      on_hz: 16
    kenyon:
      low: 86
      high: 103
      every_s: 0.85
      fastest_s: 0.38
      duration: 0.12
      gain: 0.35
      on_hz: 1.4
    memory:
      low: 48
      high: 67
      every_s: 1.8
      fastest_s: 1.0
      duration: 1.6
      gain: 0.5
    avoid:
      low: 57
      high: 76
      every_s: 0.75
      fastest_s: 0.34
      duration: 0.4
      gain: 0.6
    loom:
      low: 74
      high: 96
      every_s: 0.26
      fastest_s: 0.1
      gain: 0.7
    saccade_left: {low: 69, high: 88, duration: 0.16}
    saccade_right: {low: 69, high: 88, duration: 0.16}
    giant_fiber: {low: 33, high: 52, duration: 1.6}
    dopamine: {low: 38, high: 57, duration: 1.2}

  # ---------------------------------------------------------------- the sound
  # flydrones.music.synth. Every patch here overrides one of the defaults; the
  # partial tilts are what "bright" means in practice — a strong attack full of
  # harmonics, each one decaying faster than the one below it.
  synth:
    master_gain: 1.05
    air: 0.55
    compress: 3.2
    compress_threshold: 0.10
    highpass_hz: 60
    send_highpass_hz: 320
    low_tilt: 0.34              # the high shelf, as signal minus a smoothed copy of itself
    elastic: 1.0           # note lengths follow the tempo
    delay: {time_s: 0.41, feedback: 0.36, mix: 0.26, ping_pong: true}
    reverb: {mix: 0.34, size: 0.86, damp: 0.22}
    tail_s: 4.0
    patches:
      flylead:             # the wings
        partials: 22
        tilt: 1.05
        decay_tilt: 0.62
        attack: 0.01
        decay: 0.5
        sustain: 0.2
        release: 0.5
        unison: 3
        detune_cents: 9
        glide_s: 0.085     # the wings slide into each other when the notes are close
        vibrato: 0.06
        gain: 0.4
        send_delay: 0.5
        send_reverb: 0.42
      flybass:
        partials: 12
        tilt: 1.35
        decay: 0.55
        sustain: 0.22
        glide_s: 0.13
        gain: 0.34
        send_delay: 0.1
        send_reverb: 0.12
      flyair:              # the optic-flow texture: a pad, mostly reverb
        attack: 0.35
        decay: 1.4
        sustain: 0.55
        release: 1.3
        detune_cents: 13
        gain: 0.2
        send_reverb: 0.78
        stretch: 2.0
      flyspark:            # Kenyon cells, as little bells
        fm_ratio: 4.02
        fm_index: 2.4
        fm_decay: 0.07
        decay: 0.18
        release: 0.22
        gain: 0.17
        send_delay: 0.65
        send_reverb: 0.6
      flyturn:             # the learned turn, and the memory letting go
        partials: 14
        tilt: 1.2
        decay: 0.5
        sustain: 0.28
        glide_s: 0.1
        vibrato: 0.05
        gain: 0.32
        send_reverb: 0.5
      flyloom:
        partials: 14
        tilt: 1.0
        decay: 0.2
        gain: 0.2
      flyperc:
        decay: 0.09
        gain: 0.26
      flycrash: {fm_index: 5.4, decay: 1.6, release: 1.8, gain: 0.46, send_reverb: 0.85}
      flysting: {fm_index: 4.4, decay: 1.0, gain: 0.38, send_reverb: 0.72}
