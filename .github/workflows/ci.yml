name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev,data]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke demo
        run: flydrones demo --seconds 4
      - name: Smoke compose
        run: flydrones compose --seconds 6 --fast --to "print,jsonl:score.jsonl" --score score.tidal
      - name: Smoke radio
        run: flydrones radio --minutes-per-show 0.05 --hours 0.004 --wait 0 --to "print:4,jsonl:radio.jsonl"
      - name: Smoke LTE prober
        run: flydrones link --link mock --seconds 2 --link-period 0.5 --csv /tmp/link.csv
      - name: Smoke learning
        run: flydrones learn --laps 3 --track /tmp/ci-track.json
      - name: Browser engine matches Python
        run: node tools/check_web_engine.mjs
